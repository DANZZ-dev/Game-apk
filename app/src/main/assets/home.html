<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0c1e">
<title>Poki Hub</title>
<style>
  :root{
    --bg:#0b0c1e; --card:#161833; --line:rgba(255,255,255,.07);
    --acc:#7c6cff; --cy:#22d3ee; --pk:#ff5fa2;
    --txt:#f4f4ff; --mut:#8e91b8; color-scheme:dark;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg)}
  body{
    color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    min-height:100vh;overflow-x:hidden;touch-action:manipulation;
    transition:opacity .13s ease,transform .13s ease;
  }
  body.leave{opacity:0;transform:scale(.98)}
  .hide{display:none!important}

  /* Latar: gradien statis + 2 blob yang bergerak (hanya transform => ringan) */
  .bg{position:fixed;top:0;left:0;right:0;bottom:0;z-index:-1;overflow:hidden;pointer-events:none}
  .blob{position:absolute;width:340px;height:340px;border-radius:50%;will-change:transform}
  .b1{top:-120px;left:-100px;background:radial-gradient(closest-side,rgba(124,108,255,.38),rgba(124,108,255,0));animation:drift1 16s ease-in-out infinite alternate}
  .b2{bottom:-140px;right:-120px;background:radial-gradient(closest-side,rgba(34,211,238,.24),rgba(34,211,238,0));animation:drift2 19s ease-in-out infinite alternate}
  @keyframes drift1{to{transform:translate3d(80px,120px,0) scale(1.15)}}
  @keyframes drift2{to{transform:translate3d(-90px,-110px,0) scale(1.1)}}

  .wrap{max-width:620px;margin:0 auto;padding:22px 16px 32px}

  /* Hero */
  .hi{color:var(--mut);font-size:14px;font-weight:600;animation:rise .5s cubic-bezier(.2,.8,.2,1) backwards}
  h1{margin:4px 0 2px;font-size:30px;line-height:1.15;letter-spacing:-.5px;display:flex;align-items:center;gap:10px;animation:rise .5s .05s cubic-bezier(.2,.8,.2,1) backwards}
  h1 em{font-style:normal;background:linear-gradient(90deg,#a29bfe,#22d3ee);-webkit-background-clip:text;background-clip:text;color:transparent}
  .logo{display:inline-block;animation:bob 3s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(-4px) rotate(-6deg)}}
  .sub{color:var(--mut);margin:0 0 18px;font-size:14px;animation:rise .5s .1s cubic-bezier(.2,.8,.2,1) backwards}

  /* Pencarian */
  .search{position:relative;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px 6px 6px 14px;transition:border-color .2s ease,transform .2s ease;animation:rise .5s .15s cubic-bezier(.2,.8,.2,1) backwards}
  .search::after{content:"";position:absolute;left:-1px;right:-1px;top:-1px;bottom:-1px;border-radius:16px;border:1.5px solid transparent;background:linear-gradient(90deg,#7c6cff,#22d3ee) border-box;-webkit-mask:linear-gradient(#000 0 0) padding-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:0;transition:opacity .25s ease;pointer-events:none}
  .search:focus-within::after{opacity:1}
  .search:focus-within{transform:translateY(-1px)}
  .search svg{flex:none;width:20px;height:20px;fill:var(--mut)}
  .search input{flex:1;min-width:0;padding:10px 0;border:0;background:transparent;color:var(--txt);font-size:15px;outline:none}
  .search input::-webkit-search-cancel-button{display:none}
  .clr{width:28px;height:28px;border:0;border-radius:50%;background:rgba(255,255,255,.08);color:var(--mut);font-size:13px;padding:0;opacity:0;transform:scale(.6);pointer-events:none;transition:opacity .15s,transform .2s}
  .clr.on{opacity:1;transform:scale(1);pointer-events:auto}
  .go{border:0;border-radius:11px;background:linear-gradient(135deg,#7c6cff,#a04bff);color:#fff;font-weight:700;font-size:14px;padding:11px 18px}

  /* Chip pencarian cepat */
  .chips{display:flex;gap:8px;overflow-x:auto;padding:12px 2px 4px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none;scroll-snap-type:x proximity;animation:rise .5s .2s cubic-bezier(.2,.8,.2,1) backwards}
  .chips::-webkit-scrollbar,.rail::-webkit-scrollbar{display:none}
  .chip{flex:none;scroll-snap-align:start;padding:8px 13px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--txt);text-decoration:none;font-size:13px;font-weight:600}

  /* Press + ripple */
  .press{position:relative;overflow:hidden;transition:transform .15s ease}
  .press:active{transform:scale(.96)}
  .rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.22);transform:scale(0);animation:rip .5s ease-out forwards;pointer-events:none}
  @keyframes rip{to{transform:scale(1);opacity:0}}

  /* Kartu utama */
  .hero-card{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:14px 0 6px;padding:18px;border-radius:20px;color:#fff;text-decoration:none;background:linear-gradient(120deg,#7c6cff,#b44cff 60%,#ff5fa2);box-shadow:0 10px 28px rgba(124,108,255,.28);animation:rise .55s .25s cubic-bezier(.2,.8,.2,1) backwards}
  .hero-card small{display:block;font-size:11px;font-weight:800;letter-spacing:1px;opacity:.85}
  .hero-card strong{display:block;font-size:19px;margin:3px 0}
  .hero-card span{font-size:13px;opacity:.9}
  .hero-card i{font-style:normal;font-size:44px;animation:bob 2.4s ease-in-out infinite}
  .hero-card::after{content:"";position:absolute;top:0;bottom:0;left:0;width:40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.28),transparent);transform:translateX(-130%) skewX(-18deg);animation:shine 3.6s ease-in-out infinite;pointer-events:none}
  @keyframes shine{55%,100%{transform:translateX(330%) skewX(-18deg)}}

  h2{display:flex;align-items:center;justify-content:space-between;font-size:13px;margin:26px 2px 12px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.8px}
  h2 button{border:0;background:none;color:var(--acc);font-weight:700;font-size:12px;padding:4px 6px}

  /* Kategori */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
  .cat{display:block;padding:16px 14px;border-radius:18px;color:var(--txt);text-decoration:none;font-weight:700;font-size:15px;background:linear-gradient(145deg,rgba(var(--c),.26),rgba(var(--c),.07));border:1px solid rgba(var(--c),.28);animation:rise .5s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i)*45ms + 300ms)}
  .cat .ic{display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:14px;margin-bottom:10px;font-size:24px;background:rgba(var(--c),.22)}
  .cat small{display:block;margin-top:2px;font-weight:500;font-size:12px;color:var(--mut)}

  /* Rail terakhir dimainkan */
  .rail{display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:0 16px 4px;scrollbar-width:none;scroll-snap-type:x proximity}
  .rcard{flex:none;width:112px;scroll-snap-align:start;padding:12px 10px;border-radius:16px;background:var(--card);border:1px solid var(--line);color:var(--txt);text-decoration:none;text-align:center;animation:rise .45s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i)*50ms)}
  .rcard b{display:block;margin-top:8px;font-size:12px;line-height:1.3;height:32px;overflow:hidden}
  .av{width:48px;height:48px;border-radius:15px;margin:0 auto;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;color:#fff;flex:none}

  /* Favorit */
  .fav{display:flex;align-items:center;margin-bottom:10px;border-radius:16px;background:var(--card);border:1px solid var(--line);max-height:200px;overflow:hidden;animation:rise .45s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i)*55ms);transition:max-height .3s ease,opacity .25s ease,transform .3s ease,margin .3s ease}
  .fav.out{max-height:0!important;opacity:0;transform:translateX(60px);margin-bottom:0;border-width:0}
  .favlink{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:12px 6px 12px 12px;color:var(--txt);text-decoration:none}
  .favlink .av{width:42px;height:42px;border-radius:13px;font-size:17px}
  .ft{min-width:0}
  .ft b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ft small{color:var(--mut);font-size:12px}
  .rm{flex:none;width:44px;height:44px;margin-right:6px;border:0;border-radius:50%;background:none;color:#ff7675;font-size:16px}
  .rm:active{background:rgba(255,118,117,.15)}

  .empty{text-align:center;color:var(--mut);font-size:14px;padding:34px 10px;line-height:1.6}
  .empty i{display:block;font-style:normal;font-size:52px;margin-bottom:8px;animation:bob 2.6s ease-in-out infinite}

  .enter{animation:fade .35s ease backwards}
  @keyframes fade{from{opacity:0;transform:translateY(10px)}}
  @keyframes rise{from{opacity:0;transform:translateY(16px)}}

  /* Perangkat lemah / pengguna minta animasi dikurangi */
  .lite .blob,.lite .hero-card::after,.lite .logo,.lite .hero-card i,.lite .empty i{animation:none}
  .lite .rip{display:none}
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;animation-delay:0s!important;transition-duration:.01ms!important}
  }
</style>
</head>
<body>
  <div class="bg"><div class="blob b1"></div><div class="blob b2"></div></div>

  <div class="wrap">
    <div class="hi" id="greet">Halo, gamer 👋</div>
    <h1><span class="logo">🎮</span><span>Poki <em>Hub</em></span></h1>
    <p class="sub" id="subline">Main game seru langsung dari HP-mu</p>

    <div id="homeView">
      <form id="sf" class="search" autocomplete="off">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        <input id="q" type="search" enterkeyhint="search" placeholder="Cari game…">
        <button type="button" id="clr" class="clr" aria-label="Hapus">✕</button>
        <button type="submit" class="go press">Cari</button>
      </form>
      <div class="chips" id="chips"></div>

      <a class="hero-card press" href="https://poki.com/id">
        <div><small>TERPOPULER</small><strong>Semua game populer</strong><span>Ribuan game gratis, tanpa instal</span></div>
        <i>🔥</i>
      </a>

      <section id="recentSec" class="hide">
        <h2>Terakhir dimainkan <button id="clearRecent" type="button">Hapus</button></h2>
        <div class="rail" id="recent"></div>
      </section>

      <h2>Kategori</h2>
      <div class="grid" id="cats"></div>
    </div>

    <div id="favView" class="hide">
      <h2>Favoritmu</h2>
      <div id="favList"></div>
    </div>
  </div>

<script>
(function(){
  // Edit daftar kategori di sini: [nama, emoji, slug URL Poki, warna "r,g,b"]
  var CATS = [
    ["Aksi","💥","action","255,95,95"], ["Petualangan","🗺️","adventure","255,170,60"],
    ["Balapan","🏎️","racing","255,214,70"], ["Teka-teki","🧩","puzzle","80,220,150"],
    ["Olahraga","⚽","sports","60,200,120"], ["Menembak","🎯","shooting","255,95,162"],
    ["Strategi","♟️","strategy","124,108,255"], ["Kasual","🍬","casual","255,130,200"],
    ["Arkade","🕹️","arcade","34,211,238"], ["Multiplayer","👥","multiplayer","90,150,255"]
  ];
  var CHIPS = [["🚗","Mobil"],["🧟","Zombie"],["🎨","Mewarnai"],["🍳","Memasak"],["👫","2 pemain"],["⚽","Bola"],["🧱","Blok"],["🏰","Tower defense"]];
  var BASE = "https://poki.com/id/";

  var root = document.documentElement;
  var lite = (navigator.hardwareConcurrency || 4) <= 4 || (navigator.deviceMemory || 4) <= 2;
  if (lite) root.classList.add("lite");

  function $(id){ return document.getElementById(id); }
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
  function nat(fn){ try { return (window.Android && Android[fn]) ? Android[fn]() : "[]"; } catch(e){ return "[]"; } }
  function parse(s){ try { return JSON.parse(s) || []; } catch(e){ return []; } }
  function tick(){ try { if (window.Android && Android.tick) Android.tick(); } catch(e){} }
  function avatar(t){
    var h = 0, i; for (i = 0; i < t.length; i++) h = (h * 31 + t.charCodeAt(i)) % 360;
    return "background:linear-gradient(135deg,hsl(" + h + ",75%,60%),hsl(" + ((h + 45) % 360) + ",75%,48%))";
  }
  function initial(t){ return esc((t.trim().charAt(0) || "?").toUpperCase()); }

  // Sapaan sesuai waktu
  var hr = new Date().getHours();
  $("greet").textContent = "Selamat " + (hr < 11 ? "pagi" : hr < 15 ? "siang" : hr < 18 ? "sore" : "malam") + " 👋";

  // Kategori & chip
  $("cats").innerHTML = CATS.map(function(c, i){
    return '<a class="cat press" style="--i:' + Math.min(i, 9) + ';--c:' + c[3] + '" href="' + BASE + c[2] + '">' +
           '<div class="ic">' + c[1] + '</div>' + c[0] + '<small>Jelajahi</small></a>';
  }).join("");
  $("chips").innerHTML = CHIPS.map(function(c){
    return '<a class="chip press" href="' + BASE + 'search?q=' + encodeURIComponent(c[1]) + '">' + c[0] + ' ' + c[1] + '</a>';
  }).join("");

  // Pencarian
  var q = $("q"), clr = $("clr");
  q.addEventListener("input", function(){ clr.classList.toggle("on", q.value.length > 0); });
  clr.addEventListener("click", function(){ q.value = ""; clr.classList.remove("on"); q.focus(); });
  $("sf").addEventListener("submit", function(e){
    e.preventDefault();
    var v = q.value.trim();
    if (v) { q.blur(); go(BASE + "search?q=" + encodeURIComponent(v)); }
  });

  // Navigasi dengan transisi singkat
  function go(url){
    tick();
    document.body.classList.add("leave");
    setTimeout(function(){ location.href = url; }, 120);
  }
  document.addEventListener("click", function(e){
    var a = e.target.closest && e.target.closest("a[href]");
    if (!a) return;
    var h = a.getAttribute("href");
    if (!h || h.charAt(0) === "#") return;
    e.preventDefault();
    go(a.href);
  });

  // Ripple saat disentuh (dilewati di mode lite)
  document.addEventListener("pointerdown", function(e){
    if (lite) return;
    var t = e.target.closest && e.target.closest(".press");
    if (!t) return;
    var r = t.getBoundingClientRect(), d = Math.max(r.width, r.height) * 1.3, s = document.createElement("span");
    s.className = "rip";
    s.style.cssText = "width:" + d + "px;height:" + d + "px;left:" + (e.clientX - r.left - d / 2) + "px;top:" + (e.clientY - r.top - d / 2) + "px";
    t.appendChild(s);
    setTimeout(function(){ if (s.parentNode) s.parentNode.removeChild(s); }, 520);
  }, { passive: true });

  // Terakhir dimainkan
  function renderRecent(){
    var list = parse(nat("getRecent")).slice(0, 10);
    $("recentSec").classList.toggle("hide", !list.length);
    $("recent").innerHTML = list.map(function(f, i){
      return '<a class="rcard press" style="--i:' + Math.min(i, 8) + '" href="' + esc(f.u) + '">' +
             '<div class="av" style="' + avatar(f.t) + '">' + initial(f.t) + '</div><b>' + esc(f.t) + '</b></a>';
    }).join("");
  }
  $("clearRecent").addEventListener("click", function(){
    try { if (window.Android && Android.clearRecent) Android.clearRecent(); } catch(e){}
    tick(); renderRecent();
  });

  // Favorit
  function renderFav(){
    var list = parse(nat("getFavs"));
    var el = $("favList");
    if (!list.length) {
      el.innerHTML = '<div class="empty"><i>⭐</i>Belum ada favorit.<br>Buka sebuah game lalu tekan <b>Simpan</b>.</div>';
      return;
    }
    el.innerHTML = list.map(function(f, i){
      return '<div class="fav" style="--i:' + Math.min(i, 8) + '">' +
             '<a class="favlink press" href="' + esc(f.u) + '"><div class="av" style="' + avatar(f.t) + '">' + initial(f.t) + '</div>' +
             '<div class="ft"><b>' + esc(f.t) + '</b><small>poki.com</small></div></a>' +
             '<button class="rm" data-i="' + i + '" aria-label="Hapus">✕</button></div>';
    }).join("");
    var btns = el.querySelectorAll(".rm");
    Array.prototype.forEach.call(btns, function(b){
      b.onclick = function(){
        var row = b.parentNode, url = list[b.getAttribute("data-i")].u;
        tick();
        row.style.maxHeight = row.offsetHeight + "px";
        void row.offsetWidth;
        row.classList.add("out");
        setTimeout(function(){
          try { Android.removeFav(url); } catch(e){}
          renderFav();
        }, 300);
      };
    });
  }

  // Router sederhana: beranda <-> favorit
  function retrigger(el){
    el.classList.remove("enter"); void el.offsetWidth; el.classList.add("enter");
  }
  function route(){
    var fav = location.hash === "#fav";
    $("homeView").classList.toggle("hide", fav);
    $("favView").classList.toggle("hide", !fav);
    $("subline").textContent = fav ? "Koleksi game kesayanganmu ❤️" : "Main game seru langsung dari HP-mu";
    if (fav) { renderFav(); retrigger($("favView")); }
    else { renderRecent(); }
    window.scrollTo(0, 0);
  }
  window.addEventListener("hashchange", route);
  // Saat kembali (back) halaman bisa berasal dari cache: segarkan data
  window.addEventListener("pageshow", function(){
    document.body.classList.remove("leave");
    route();
  });
  route();
})();
</script>
</body>
</html>
